name: Fenxiang isolated category coverage audit
on:
  push:
    branches: [codex/fenxiang-history-smoke]
    paths: [.github/workflows/fenxiang-history-smoke.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FENXIANG_MCP_API_KEY: ${{ secrets.FENXIANG_MCP_API_KEY }}
    steps:
      - name: Audit category samples and history entitlement (summary only)
        shell: bash
        run: |
          python3 - <<'PY'
          import os, json, re, sys, datetime, decimal, urllib.request, urllib.error
          from urllib.parse import urlsplit
          key = os.environ.get("FENXIANG_MCP_API_KEY", "").strip()
          if not key:
              print("BLOCKED: repository Actions secret FENXIANG_MCP_API_KEY is not configured.")
              sys.exit(1)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect())
          endpoint = "https://api.fenxianglife.com/njia/mcp"
          counter = 0
          def rpc(method, params=None):
              global counter
              counter += 1
              req = urllib.request.Request(endpoint, method="POST",
                  headers={"Content-Type": "application/json",
                           "Accept": "application/json, text/event-stream",
                           "X-Api-Key": key,
                           "User-Agent": "tubatools-fenxiang-history-smoke/1.0"},
                  data=json.dumps({"jsonrpc":"2.0","id":counter,"method":method,
                                   "params":params or {}}, ensure_ascii=False).encode())
              try:
                  with opener.open(req, timeout=60) as resp:
                      raw = resp.read(2 * 1024 * 1024 + 1)
                      if len(raw) > 2 * 1024 * 1024: raise ValueError("oversize")
                      body = raw.decode("utf-8")
                      if "text/event-stream" in resp.headers.get("Content-Type", ""):
                          messages = [json.loads(line[5:].strip()) for line in body.splitlines()
                                      if line.startswith("data:") and line[5:].strip()]
                          parsed = next(m for m in reversed(messages)
                                        if isinstance(m,dict) and ("result" in m or "error" in m))
                      else:
                          parsed = json.loads(body)
                  if "error" in parsed: raise RuntimeError("RPC rejected")
                  result = parsed.get("result", {})
                  if not isinstance(result, dict) or result.get("isError"):
                      raise RuntimeError("tool rejected")
                  return result
              except urllib.error.HTTPError as exc:
                  print(f"{method}: HTTP {exc.code} (response omitted)")
                  raise RuntimeError("HTTP request failed") from None
              except Exception:
                  print(f"{method}: failed (response omitted)")
                  raise RuntimeError("MCP request failed") from None
          def payloads(result):
              sc = result.get("structuredContent")
              if isinstance(sc, (dict,list)): yield sc
              for block in result.get("content", []):
                  if not isinstance(block,dict) or block.get("type") != "text": continue
                  val = block.get("text","")
                  try:
                      data = json.loads(val)
                      if isinstance(data,(dict,list)): yield data
                  except (ValueError,TypeError): pass
          def walk(obj):
              if isinstance(obj,dict):
                  yield obj
                  for v in obj.values(): yield from walk(v)
              elif isinstance(obj,list):
                  for v in obj: yield from walk(v)
          def call(name, args):
              return rpc("tools/call", {"name":name,"arguments":args})
          def shopping_url(url):
              if not isinstance(url,str): return False
              try:
                  u = urlsplit(url)
                  host = u.hostname or ""
                  domains = ("jd.com","3.cn","taobao.com","tmall.com","tb.cn","vip.com","fenxianglife.com")
                  return u.scheme == "https" and any(host == d or host.endswith("."+d) for d in domains)
              except ValueError: return False
          def valid_point(point):
              if not isinstance(point,dict): return None
              try:
                  date = datetime.date.fromisoformat(str(point["time"])[:10])
                  price = decimal.Decimal(str(point["price"]))
                  if date > datetime.date.today() + datetime.timedelta(days=1) or not price.is_finite() or price <= 0:
                      return None
                  return date.isoformat(), price
              except (KeyError,ValueError,TypeError,decimal.InvalidOperation): return None
          # Each query is a single official tools/call. No bulk crawling or persistence.
          probes = [
              ("cpu", "台式机 CPU Ryzen Core 处理器", r"CPU|处理器|Ryzen|酷睿"),
              ("gpu", "台式机 独立显卡 RTX RX", r"显卡|RTX\s*\d|RX\s*\d"),
              ("motherboard", "台式机 主板 B650 B760", r"主板|B650|B760"),
              ("memory", "台式机 DDR5 内存条 32GB", r"内存条|DDR5"),
              ("ssd", "M.2 NVMe 固态硬盘 1TB", r"固态|SSD|NVMe"),
              ("hdd", "台式机 机械硬盘 4TB", r"机械硬盘|HDD"),
              ("psu", "台式机 ATX 电源 750W", r"电源|750W"),
              ("case", "台式机 电脑机箱 ATX", r"机箱"),
              ("cooler", "CPU 散热器 风冷 水冷", r"散热器|水冷|风冷"),
              ("monitor", "电脑显示器 27英寸", r"显示器|27英寸"),
              ("desktop", "品牌 台式机 整机", r"台式机|整机|主机"),
              ("laptop_lenovo", "联想 拯救者 游戏笔记本", r"拯救者|LEGION"),
              ("laptop_asus", "华硕 ROG 游戏笔记本", r"华硕|ROG|枪神|魔霸|幻"),
              ("laptop_hp", "惠普 暗影精灵 游戏笔记本", r"惠普|暗影精灵|OMEN"),
              ("laptop_dell", "戴尔 Alienware 游戏笔记本", r"戴尔|外星人|Alienware|游匣"),
              ("laptop_acer", "宏碁 掠夺者 游戏笔记本", r"宏碁|掠夺者|Predator|暗影骑士"),
              ("laptop_msi", "微星 游戏笔记本", r"微星|MSI|泰坦|雷影"),
              ("laptop_mechrevo", "机械革命 游戏笔记本", r"机械革命|MECHREVO"),
              ("laptop_thin", "轻薄本 笔记本电脑", r"笔记本|轻薄本|Laptop|ThinkBook|MateBook|小新"),
          ]
          # Prefer product-level structured fields, and fall back to explicit Markdown links.
          # A title match is only a relevance heuristic, not validation of a model or SKU.
          def extract(result, pattern):
              candidates = {}
              def add(u, title):
                  if not shopping_url(u): return
                  title = str(title or "")
                  old = candidates.get(u, "")
                  if len(title) > len(old) or u not in candidates:
                      candidates[u] = title[:1200]
              for doc in payloads(result):
                  for entry in walk(doc):
                      title = next((entry.get(k) for k in ("goodsName","itemTitle","title","name","displayName") if isinstance(entry.get(k),str)), "")
                      for field in ("goodsUrl","url","link","buyUrl"):
                          if title or field == "goodsUrl":
                              add(entry.get(field), title)
              for block in result.get("content", []):
                  if not isinstance(block,dict) or block.get("type") != "text": continue
                  for line in str(block.get("text","")).splitlines():
                      for m in re.finditer(r"\[([^\]]+)\]\((https://[^\s)]+)\)",line):
                          label = m.group(1)
                          if re.search(r"下单|购买|去看看|商品|链接|查看",label) or re.search(pattern,line,re.I):
                              add(m.group(2), line if line.lstrip().startswith("|") else label)
              plausible = sum(bool(re.search(pattern,t,re.I)) for t in candidates.values())
              return candidates, plausible
          try:
              names = {t.get("name") for t in rpc("tools/list").get("tools",[]) if isinstance(t,dict)}
              if not {"goods_search","history_price"} <= names: raise RuntimeError("tools unavailable")
              print("MCP: OK")
              import time
              results = {}
              completed = 0
              for label,keyword,pattern in probes:
                  try:
                      r = call("goods_search", {"keyword":keyword,"platform":"all","size":5,"responseFormat":"json"})
                      urls, plausible = extract(r,pattern)
                      results[label] = list(urls)
                      completed += 1
                      print(f"COVERAGE {label}: urls={len(urls)} title_match={plausible} structured={bool(list(payloads(r)))}")
                  except RuntimeError:
                      print(f"COVERAGE {label}: request_failed")
                      break
                  time.sleep(1.2)
              print(f"SEARCH_SUMMARY attempted={min(completed+1,len(probes)) if completed<len(probes) else completed} completed={completed} nonempty={sum(bool(v) for v in results.values())} unique_urls={len(set(u for a in results.values() for u in a))}")
              checked = 0
              for label in ("cpu","gpu","laptop_lenovo"):
                  if not results.get(label): continue
                  r = call("history_price", {"goodsUrl":results[label][0],"responseFormat":"json"})
                  arrays = [e["points"] for d in payloads(r) for e in walk(d) if isinstance(e.get("points"),list)]
                  points = max(arrays,key=len,default=[])
                  dates = {p[0] for p in map(valid_point,points) if p is not None}
                  print(f"HISTORY {label}: points={len(points)} valid_dates={len(dates)}")
                  checked += 1
                  time.sleep(1.2)
              print(f"REQUEST_SUMMARY total_rpc={counter} history_checks={checked}")
          except RuntimeError:
              print(f"STOPPED total_rpc={counter}")
              sys.exit(1)
          except Exception:
              print("FAILED: unexpected response structure (details intentionally omitted).")
              sys.exit(1)
          PY
