name: Validate data collectors
on:
  push:
    branches: ["**"]
    paths:
      - "scripts/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/**"
  pull_request:

permissions:
  contents: read

jobs:
  marketplace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate marketplace feed and exact SKU matching, without keys or writes
        run: python -m unittest discover -s tests -v
      - name: Lint Python syntax
        run: python -m compileall -q scripts tests
      - name: Audit checked-in snapshots (no API)
        run: python scripts/validate_snapshot.py

  zol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Compile ZOL catalog generator only (no live scraping)
        run: dotnet build scripts/zol-feed/ZolFeed.csproj -c Release
