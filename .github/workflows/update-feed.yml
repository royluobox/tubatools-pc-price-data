name: Update price feed

on:
  schedule:
    # 每 8 小时一次，控制免费 API 额度（每天约 30 次调用）。
    - cron: "15 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe API reachability
        continue-on-error: true
        env:
          VRAMGLASS_KEY: ${{ secrets.VRAMGLASS_KEY }}
        run: |
          echo "no-auth: $(curl -s -o /dev/null -w '%{http_code}' 'https://api.vramglass.com/v1/prices?ids=rtx-5090&market=xianyu&lang=zh')"
          echo "root: $(curl -s -o /dev/null -w '%{http_code}' 'https://api.vramglass.com/')"
          echo "auth: $(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $VRAMGLASS_KEY" 'https://api.vramglass.com/v1/prices?ids=rtx-5090&market=xianyu&lang=zh')"

      - name: Fetch VRAMGlass feed
        env:
          VRAMGLASS_KEY: ${{ secrets.VRAMGLASS_KEY }}
        run: python scripts/fetch_feed.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.json
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "chore: update price snapshot"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
