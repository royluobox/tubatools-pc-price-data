name: Update price feed

on:
  schedule:
    # 每 8 小时更新；零凭据/未批准公开展示时不调用电商 API。
    - cron: "15 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Fetch VRAMGlass feed
        env:
          VRAMGLASS_KEY: ${{ secrets.VRAMGLASS_KEY }}
        run: python scripts/fetch_feed.py

      - name: Generate ZOL catalog
        continue-on-error: true
        env:
          ZOL_PAGES: "4"
          TREND_MODELS: "80"
        run: dotnet run --project scripts/zol-feed -c Release

      - name: Fetch approved JD/PDD marketplace references (optional)
        continue-on-error: true
        env:
          HJK_API_KEY: ${{ secrets.HJK_API_KEY }}
          HJK_MAX_TARGETS: "4"
          HJK_PLATFORMS: "jd,pdd"
          MARKET_PUBLISH_ENABLED: ${{ vars.MARKET_PUBLISH_ENABLED }}
          MARKET_PROVIDER: "auto"
          MARKET_PAUSE_SECONDS: "2"
          TBK_APP_KEY: ${{ secrets.TBK_APP_KEY }}
          TBK_APP_SECRET: ${{ secrets.TBK_APP_SECRET }}
          TBK_ADZONE_ID: ${{ secrets.TBK_ADZONE_ID }}
          TBK_MAX_TARGETS: "12"
        run: python scripts/fetch_market.py

      - name: Validate all snapshots before publication
        run: python scripts/validate_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/latest.json
          if [ -f site/data/catalog.json ]; then
            git add site/data/catalog.json
          fi
          if [ -f site/data/market.json ]; then
            git add site/data/market.json
          fi
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "chore: update price snapshot"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
