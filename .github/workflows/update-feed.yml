name: Update Frocloud monthly archive

on:
  schedule:
    # 每 8 小时更新；零凭据/未批准公开展示时不调用电商 API。
    - cron: "15 */8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync attributed Frocloud monthly reference archive (no API key)
        # Only publicly licensed CSVs; original month and price are retained.
        # A failed source fetch leaves the previous snapshot untouched.
        run: python scripts/fetch_frocloud.py

      - name: Validate active Frocloud snapshot
        run: python scripts/validate_snapshot.py

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/frocloud-monthly.json
          if git diff --cached --quiet; then
            echo "数据无变化"
          else
            git commit -m "chore: update price snapshot"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
