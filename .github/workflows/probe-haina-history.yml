name: Diagnose Haina history field shape (no publication)

on:
  push:
    branches: ["codex/haina-api-coverage-smoke"]
    paths: [".github/workflows/probe-haina-history.yml"]

permissions:
  contents: read

jobs:
  schema_probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check only API response field presence (3 requests, no values)
        env:
          HAINA_API_KEY: ${{ secrets.HAINA_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          if not os.getenv("HAINA_API_KEY"):
              raise SystemExit("HAINA_API_KEY secret missing")

          API_URL = "https://gw-openapi.zhidemai.com/product/v1"
          FIELDS = (
              "title", "url", "page_price", "price", "price_tags",
              "price_info_180_days", "promotional_info", "union_spec",
              "mall_id", "mall_name", "shop_name", "sales_cnt",
              "comment_cnt", "standard_month_sale_qty",
          )
          CASES = [
              ("official_example_term", "iphone16"),
              ("phone_control", "iPhone 16 Plus"),
              ("cpu_target", "9800X3D"),
          ]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, fp, code, msg, headers, newurl):
                  raise ValueError("redirect disallowed")

          opener = urllib.request.build_opener(NoRedirect())
          for label, term in CASES:
              request = urllib.request.Request(
                  API_URL,
                  data=json.dumps({
                      "product_query": term,
                      "request_from": "haina",
                      "question_id": "tubatools-history-schema-20261120-" + label,
                  }, ensure_ascii=False).encode("utf-8"),
                  headers={
                      "x-api-key": os.environ["HAINA_API_KEY"],
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              try:
                  with opener.open(request, timeout=35) as response:
                      status = response.status
                      if response.geturl() != API_URL:
                          raise ValueError("unexpected redirect")
                      raw = response.read(4_000_001)
                  if len(raw) > 4_000_000:
                      raise ValueError("oversized result")
                  obj = json.loads(raw)
                  if not isinstance(obj, dict):
                      raise ValueError("unexpected envelope")
                  data = obj.get("data")
                  rows = data.get("rows", []) if isinstance(data, dict) else []
                  rows = [r for r in rows if isinstance(r, dict)] if isinstance(rows, list) else []
                  code = obj.get("error_code")
                  code = code if isinstance(code, int) and abs(code) < 100000 else "unknown"
                  print(f"{label}: http={status} code={code} dict_rows={len(rows)}")
                  for field in FIELDS:
                      present = sum(field in r for r in rows)
                      populated = sum(field in r and r[field] not in (None, "", [], {}, "null") for r in rows)
                      print(f"  {field}: present={present}/{len(rows)} populated={populated}/{len(rows)}")
                  if rows:
                      sizes = [len(r) for r in rows]
                      print(f"  total_row_key_counts: min={min(sizes)} max={max(sizes)}")
              except urllib.error.HTTPError as ex:
                  print(f"{label}: http={ex.code}; no response body logged")
              except Exception as ex:
                  print(f"{label}: diagnostic_error={type(ex).__name__}; no response data logged")
              time.sleep(1)
          print("Probe finished; no API key, product titles, prices, URLs, or raw payload printed or published.")
          PY
