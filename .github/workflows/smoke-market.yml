name: Smoke test HaoJingKe JD schema (no publication)

on:
  workflow_dispatch:
  push:
    branches: ["codex/authorized-market-feed-v3"]
    paths: [".github/workflows/smoke-market.yml"]

permissions:
  contents: read

jobs:
  verify-api:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[smoke-hjk]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect one JD response schema, no values or publication
        env:
          HJK_API_KEY: ${{ secrets.HJK_API_KEY }}
        run: |
          if [ -z "$HJK_API_KEY" ]; then
            echo "::error::HJK_API_KEY unavailable"
            exit 1
          fi
          PYTHONPATH=scripts python - <<'PY'
          import json
          import os
          from haojingke import query_haojingke

          def schema(value, depth=0):
              if depth > 4:
                  return "max-depth"
              if isinstance(value, dict):
                  result = {}
                  for name, child in list(value.items())[:30]:
                      if not isinstance(name, str) or len(name) > 50:
                          continue
                      if any(token in name.lower() for token in
                             ("token", "secret", "password", "cookie", "apikey", "mobile")):
                          continue
                      result[name] = schema(child, depth + 1)
                  return result
              if isinstance(value, list):
                  return {"type": "list", "length": len(value),
                          "first_schema": schema(value[0], depth + 1) if value else None}
              return type(value).__name__

          try:
              payload = query_haojingke("jd", {"query": "RTX 5070"}, os.environ["HJK_API_KEY"])
              print("JD RESPONSE SHAPE ONLY:", json.dumps(schema(payload), ensure_ascii=False))
          except Exception as error:
              print("JD probe failure type:", type(error).__name__)
              raise SystemExit(1)
          PY
