name: Smoke test HaoJingKe JD detail (no publication)

on:
  workflow_dispatch:
  push:
    branches: ["codex/authorized-market-feed-v3"]
    paths: [".github/workflows/smoke-market.yml"]

permissions:
  contents: read

jobs:
  verify-api:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[smoke-hjk]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe documented JD detail on two known SKUs without storing results
        env:
          HJK_API_KEY: ${{ secrets.HJK_API_KEY }}
        run: |
          if [ -z "$HJK_API_KEY" ]; then
            echo "::error::HJK_API_KEY unavailable"
            exit 1
          fi
          PYTHONPATH=scripts python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          # Documented HJK goodsdetail API uses goods_id (singular).
          endpoint = "https://api-gw.haojingke.com/index.php/v1/api/jd/goodsdetail"
          cases = [
              ("Ryzen 7 9800X3D", "100147630258", "9800X3D"),
              ("RTX 5070", "10154190683550", "5070"),
          ]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("redirect refused")

          opener = urllib.request.build_opener(NoRedirect())
          for label, sku, expected_model in cases:
              form = {"apikey": os.environ["HJK_API_KEY"], "goods_id": sku}
              request = urllib.request.Request(
                  endpoint,
                  data=urllib.parse.urlencode(form).encode("utf-8"),
                  method="POST",
                  headers={"Content-Type": "application/x-www-form-urlencoded; charset=utf-8",
                           "User-Agent": "TubatoolsPriceFeed/4.0"})
              try:
                  with opener.open(request, timeout=25) as response:
                      if response.geturl() != endpoint:
                          raise ValueError("unexpected URL")
                      raw = response.read(2_000_001)
                  if len(raw) > 2_000_000:
                      raise ValueError("oversized response")
                  payload = json.loads(raw)
                  if not isinstance(payload, dict):
                      raise ValueError("not a JSON object")
                  original_status = payload.get("status_code")
                  candidate = str(original_status).strip()
                  status = candidate if candidate.isascii() and candidate.isdigit() and len(candidate) <= 3 else "other"
                  present_fields = sorted(k for k in ("status_code", "status", "code", "data", "message", "msg", "error_code") if k in payload)
                  data_shape = type(payload.get("data")).__name__
                  print(f"{label} envelope: status={status}, status_type={type(original_status).__name__}, "
                        f"fields={','.join(present_fields)}, data_type={data_shape}")
                  details = payload.get("data")
                  if isinstance(details, list):
                      details = details[0] if details and isinstance(details[0], dict) else None
                  elif isinstance(details, dict) and isinstance(details.get("data"), dict):
                      details = details["data"]
                  available = isinstance(details, dict) and bool(details)
                  returned_sku = str(details.get("goods_id", "")) if available else ""
                  title = str(details.get("goods_name", "")) if available else ""
                  exact_id = bool(returned_sku and returned_sku == sku)
                  title_found = bool(expected_model in title.upper())
                  price_present = bool(available and details.get("price") not in (None, ""))
                  print(f"{label} detail: status={status}, has_detail={available}, "
                        f"sku_match={exact_id}, model_in_title={title_found}, "
                        f"has_price_field={price_present}")
              except Exception as error:
                  print(f"{label} detail: transport/schema error type={type(error).__name__}")
              time.sleep(2)
          print("No price values, API credentials, or snapshots were logged or published.")
          PY
