name: Diagnose JD public price endpoint (no publication)

on:
  workflow_dispatch:
  push:
    branches: ["codex/authorized-market-feed-v3"]
    paths: [".github/workflows/smoke-market.yml"]

permissions:
  contents: read

jobs:
  verify-price:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[smoke-hjk]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test a few known SKUs without collecting or publishing prices
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.request
          from urllib.error import HTTPError, URLError
          from decimal import Decimal, InvalidOperation

          SKUS = [
              ("Ryzen 9800X3D", "100147630258"),
              ("RTX 5070", "10154190683550"),
              ("historical control", "100003961325"),
          ]
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("redirect refused")

          opener = urllib.request.build_opener(NoRedirect())
          for label, sku in SKUS:
              url = "https://p.3.cn/prices/mgets?skuIds=J_" + sku
              req = urllib.request.Request(
                  url, headers={"User-Agent": "TubatoolsPriceFeed-Diagnostics/1.0",
                                "Accept": "application/json"})
              try:
                  with opener.open(req, timeout=15) as response:
                      status = response.status
                      if response.geturl() != url:
                          raise ValueError("unexpected destination")
                      raw = response.read(100_001)
                  if len(raw) > 100_000:
                      raise ValueError("oversized response")
                  data = json.loads(raw)
                  entries = data if isinstance(data, list) else []
                  matched = [row for row in entries if isinstance(row, dict)
                             and str(row.get("id", "")) == "J_" + sku]
                  has_price = False
                  for row in matched:
                      try:
                          price = Decimal(str(row.get("p", "")))
                          has_price = has_price or price.is_finite() and 0 < price < 1000000
                      except (InvalidOperation, ValueError):
                          pass
                  print(f"{label}: http={status}, json_list={isinstance(data, list)}, "
                        f"sku_match={bool(matched)}, positive_price={has_price}")
              except HTTPError as err:
                  print(f"{label}: http={err.code}, sku_match=False, positive_price=False")
              except (URLError, TimeoutError, ValueError, json.JSONDecodeError) as err:
                  print(f"{label}: unavailable={type(err).__name__}")
              time.sleep(2)
          print("Diagnostic only. No price values, credentials or data snapshots published.")
          PY
