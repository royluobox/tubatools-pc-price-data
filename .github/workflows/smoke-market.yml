name: Smoke test HaoJingKe JD pool (no publication)

on:
  workflow_dispatch:
  push:
    branches: ["codex/authorized-market-feed-v3"]
    paths: [".github/workflows/smoke-market.yml"]

permissions:
  contents: read

jobs:
  verify-api:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[smoke-hjk]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Distinguish empty affiliate pool from missing hardware coverage
        env:
          HJK_API_KEY: ${{ secrets.HJK_API_KEY }}
        run: |
          if [ -z "$HJK_API_KEY" ]; then
            echo "::error::HJK_API_KEY unavailable"
            exit 1
          fi
          PYTHONPATH=scripts python - <<'PY'
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          from urllib.error import HTTPError
          endpoints = {
              "list": "https://api-gw.haojingke.com/index.php/v1/api/jd/goodslist",
              "detail": "https://api-gw.haojingke.com/index.php/v1/api/jd/goodsdetail",
          }
          cases = [
              ("No filter, default coupon", "list", {"pageindex": "1", "pagesize": "10"}),
              ("No filter, coupon off", "list", {"pageindex": "1", "pagesize": "10", "iscoupon": "0"}),
              ("Common phone keyword", "list", {"pageindex": "1", "pagesize": "10", "iscoupon": "0", "keyword": "手机"}),
              ("Broad AMD keyword", "list", {"pageindex": "1", "pagesize": "10", "iscoupon": "0", "keyword": "AMD"}),
              ("Short GPU keyword", "list", {"pageindex": "1", "pagesize": "10", "iscoupon": "0", "keyword": "5070"}),
              ("Known CPU detail", "detail", {"goods_id": "100147630258"}),
              ("Official-doc sample detail", "detail", {"goods_id": "66982790389"}),
          ]

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  raise ValueError("redirect refused")

          def safe_code(value):
              code = str(value).strip()
              return code if code.isascii() and code.isdigit() and len(code) <= 8 else "n/a"

          def safe_reason(payload):
              message = str(payload.get("message") or payload.get("msg") or "")[:600]
              categories = {
                  "authorization": ("未授权", "授权", "权限", "登录", "认证", "签约"),
                  "account": ("账号", "账户", "京盟", "联盟", "appkey", "appsecret", "appid"),
                  "missing_product": ("商品不存在", "商品未找到", "没有找到", "无此商品", "不存在"),
                  "rate_limit": ("限流", "频繁", "次数", "超限", "quota", "rate limit"),
                  "parameter": ("参数", "缺少", "格式错误"),
                  "service": ("系统", "服务器", "稍后", "异常", "失败"),
              }
              labels = [category for category, patterns in categories.items()
                        if any(pattern.lower() in message.lower() for pattern in patterns)]
              return "+".join(labels) if labels else ("present-unclassified" if message else "no-message")

          opener = urllib.request.build_opener(NoRedirect())
          for label, endpoint_type, params in cases:
              endpoint = endpoints[endpoint_type]
              form = {"apikey": os.environ["HJK_API_KEY"]}
              form.update(params)
              request = urllib.request.Request(
                  endpoint,
                  data=urllib.parse.urlencode(form).encode("utf-8"),
                  method="POST",
                  headers={"Content-Type": "application/x-www-form-urlencoded; charset=utf-8",
                           "User-Agent": "TubatoolsPriceFeed/4.0"})
              try:
                  with opener.open(request, timeout=25) as response:
                      if response.geturl() != endpoint:
                          raise ValueError("unexpected URL")
                      raw = response.read(2_000_001)
                  if len(raw) > 2_000_000:
                      raise ValueError("oversized response")
                  payload = json.loads(raw)
                  if not isinstance(payload, dict):
                      raise ValueError("not JSON object")
                  status = safe_code(payload.get("status_code"))
                  reason = safe_reason(payload)
                  data = payload.get("data")
                  if endpoint_type == "list":
                      rows = data.get("data") if isinstance(data, dict) else None
                      total = data.get("total") if isinstance(data, dict) else None
                      row_count = len(rows) if isinstance(rows, list) else (
                          0 if rows in ("", [], None) else "non-list")
                      safe_total = total if isinstance(total, int) and 0 <= total <= 1000000 else "unknown"
                      print(f"{label}: status={status}, total={safe_total}, rows={row_count}, "
                            f"data_shape={type(data).__name__}, reason={reason}")
                  else:
                      details = data if isinstance(data, dict) else None
                      found = isinstance(details, dict) and bool(details.get("goods_id"))
                      print(f"{label}: status={status}, detail_found={found}, "
                            f"data_shape={type(data).__name__}, reason={reason}")
              except HTTPError as error:
                  print(f"{label}: http_status={safe_code(error.code)}")
              except Exception as error:
                  print(f"{label}: transport_or_schema={type(error).__name__}")
              time.sleep(2)
          print("No prices, identifiers from API payloads, messages, keys, or snapshots were published.")
          PY
